<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <style>
    * {
      margin: 0;

      box-sizing: border-box;
      font-family: Arial, sans-serif;

    .hero {
      height: 80vh;
      display: flex;

    }

    .hero p {

    .hero button {

      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .hero button:hover {

    footer {
