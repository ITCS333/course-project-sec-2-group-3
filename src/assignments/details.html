<!--
  Requirement: Create the Dedicated Page for a Single Assignment

  Instructions:
  This page displays the full details for one assignment and allows
  students to read and post discussion comments.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TODO: Add <meta> tags for charset (UTF-8) and viewport
         (width=device-width, initial-scale=1.0). -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     

    <!-- TODO: Add a <title>, e.g., "Assignment Details". -->
    <title>Assignment Details</title>

    <!-- TODO: Link to your CSS framework or stylesheet. -->
    <link rel="stylesheet" href="../common/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f7eeee;
        }

        header {
            background-color: #9e5c6a;
            color: #fdf5f6;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 6px;
        }

        h1, h2 {
            margin: 0 0 15px 0;
            color: #5c2d38;
        }

        header h1 {
            color: #fdf5f6;
        }

        main {
            max-width: 900px;
            margin: auto;
        }

        article, section {
            background: #fffafa;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 6px;
            box-shadow: 0px 2px 5px rgba(158,92,106,0.12);
        }

        fieldset {
            border: 1px solid #e0b4bc;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        legend {
            font-weight: bold;
            color: #9e5c6a;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #5c2d38;
        }

        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #d4a0aa;
            box-sizing: border-box;
            height: 80px;
            resize: vertical;
            background-color: #fdf0f2;
            color: #5c2d38;
            font-weight: 500;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #9e5c6a;
            color: #fdf5f6;
            font-size: 14px;
        }

        button:hover {
            background-color: #7d4455;
        }

        p {
            color: #5c2d38;
            font-weight: 500;
        }

        ul {
            color: #5c2d38;
        }

        ul a {
            color: #9e5c6a;
        }

        ul a:hover {
            color: #5c2d38;
        }

        #comment-list article {
            background: #fdf0f2;
            border-left: 4px solid #9e5c6a;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 6px;
            box-shadow: none;
        }

        #comment-list article footer {
            margin-top: 8px;
            font-size: 13px;
            color: #9e5c6a;
            font-weight: 600;
        }

    </style>

    <!-- Required: link details.js with defer. -->
    <script src="details.js" defer></script>
</head>
<body>

    <!-- TODO: Create a <header>.
         Inside it, add an <h1 id="assignment-title">.
         details.js will set its textContent to the assignment's title.
         Leave it empty for now. -->
     <header>
          <h1 id="assignment-title"></h1>
     </header>

    <!-- TODO: Create the <main> content area. -->
    <main>

        <!-- ============================================================
             Section 1: Assignment Information
             ============================================================ -->
        <!-- TODO: Use an <article> to display the main assignment
             information. -->
        <article>

            <!-- TODO: Add a <p id="assignment-due-date">.
                 details.js will set it to "Due: YYYY-MM-DD"
                 using the due_date column from the assignments table. -->
            <p id="assignment-due-date"></p>

            <!-- TODO: Add a <h2> "Description". -->
            <h2>Description</h2>

            <!-- TODO: Add a <p id="assignment-description">.
                 details.js will set its textContent to the assignment's
                 description from the assignments table. -->
            <p id="assignment-description"></p>

            <!-- TODO: Add a <h2> "Attached Files &amp; Links". -->
            <h2>Attached Files &amp; Links</h2>

            <!-- TODO: Add a <ul id="assignment-files-list">.
                 details.js will populate this list from the files column
                 in the assignments table. That column is a JSON-encoded
                 array of URL strings. Each URL becomes a
                 <li><a href="{url}">{url}</a></li> item.
                 Leave the list empty here. -->
            <ul id="assignment-files-list"></ul>

        <!-- End of <article> -->
        </article>


        <!-- ============================================================
             Section 2: Discussion Forum
             ============================================================ -->
        <!-- TODO: Create a <section id="discussion-forum">. -->
        <section id="discussion-forum">

            <!-- TODO: Add a <h2> "Questions &amp; Discussion". -->
            <h2>Questions &amp; Discussion</h2>

            <!-- Subsection 2.1: Existing Comments -->
            <!-- TODO: Add a <div id="comment-list">.
                 details.js will inject one <article> per comment here.
                 Each comment article follows this structure:

                 <article>
                     <p>Comment text goes here.</p>
                     <footer>Posted by: Author Name</footer>
                 </article>

                 Comments come from the comments_assignment table
                 (columns: id, assignment_id, author, text, created_at).
                 Leave the div empty here. -->
            <div id="comment-list"></div>

            <!-- Subsection 2.2: Add a Comment Form -->
            <!-- TODO: Create a <form id="comment-form"> (action="#").
                 The id is required by details.js. -->
            <form id="comment-form">

                <!-- TODO: Use a <fieldset> to group the controls. -->
                    <!-- TODO: Add a <legend>, e.g., "Ask a Question". -->
               <fieldset>
                    <legend>Ask a Question</legend>

                    <!-- TODO: Add a <label> and <textarea> for the comment.
                         - label for="new-comment"
                         - textarea id="new-comment", required
                         - The id must be exactly "new-comment" as
                           details.js reads this element by that id. -->
                    <label for="new-comment" >Your Comment</label>
                    <textarea id="new-comment" required></textarea>

                    <!-- TODO: Add a submit <button>.
                         - type="submit"
                         - Text: "Post Comment" -->
                    <button type="submit">Post Comment</button>
                <!-- End of <fieldset> -->
                </fieldset>
            <!-- End of <form> -->
            </form>

        <!-- End of <section#discussion-forum> -->
        </section>

    <!-- End of <main> -->
    </main>
</body>
</html>
