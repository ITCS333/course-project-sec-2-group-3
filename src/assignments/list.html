<!--
  Requirement: Create the Student View for Assignments

  Instructions:
  This page is a read-only view for students to see all course assignments.
  Each assignment should link to its dedicated detail page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TODO: Add <meta> tags for charset (UTF-8) and viewport
         (width=device-width, initial-scale=1.0). -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     

    <!-- TODO: Add a <title>, e.g., "Course Assignments". -->
    <title>Course Assignments</title>

    <!-- TODO: Link to your CSS framework or stylesheet. -->
    <link rel="stylesheet" href="../common/styles.css"">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f7eeee;
        }

        header {
            background-color: #9e5c6a;
            color: #fdf5f6;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 6px;
        }

        h1, h2 {
            margin: 0 0 15px 0;
            color: #5c2d38;
        }

        header h1 {
            color: #fdf5f6;
        }

        main {
            max-width: 900px;
            margin: auto;
        }

        section {
            background: #fffafa;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 6px;
            box-shadow: 0px 2px 5px rgba(158,92,106,0.12);
        }

        article {
            background: #fdf0f2;
            border-left: 4px solid #9e5c6a;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        article p {
            color: #5c2d38;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        article a {
            color: #9e5c6a;
            font-weight: 600;
            text-decoration: none;
        }

        article a:hover {
            color: #5c2d38;
            text-decoration: underline;
        }
    </style>

    

    <!-- Required: link list.js with defer so the DOM is ready before the
         script runs. -->
    <script src="list.js" defer></script>
</head>
<body>

    <!-- TODO: Create a <header> containing an <h1> "Course Assignments". -->
    <header>
        <h1>Course Assignments</h1>
        <nav><a href="../../index.html">← Back to Home</a></nav>
    </header>

    <!-- TODO: Create the <main> content area. -->
    <main>

        <!-- TODO: Create a <section id="assignment-list-section"> to contain
             the list of assignment articles.
             The id is required by list.js. -->
        <section id="assignment-list-section">

            <!-- list.js will inject one <article> per assignment here.
                 Each article follows the structure below. -->

            <!-- Example Assignment Article Structure (do NOT hardcode real
                 data; list.js fetches it from the API):

            <article>
                <h2>HTML &amp; CSS Portfolio</h2>
                <p>Due: 2025-02-15</p>
                <p>Create a responsive portfolio website...</p>
                <a href="details.html?id=1">View Details &amp; Discussion</a>
            </article>

            Note: the href MUST be "details.html?id=<id>" so that
            details.js can read the id from the URL query string. -->

        <!-- End of #assignment-list-section -->
        </section>
    <!-- End of <main> -->
    </main>
    

</body>
</html>
