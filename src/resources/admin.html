<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add meta tag for character encoding (UTF-8) -->
    <meta charset="UTF-8">
    
    <!-- Add responsive viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Add title -->
    <title>Manage Resources</title>
    
    <!-- Link to CSS framework -->
    <link rel="stylesheet" href="../common/styles.css">
    
    <!-- Link script file -->
    <script src="admin.js" defer></script>
</head>
<body>
    <main class="container">
        <!-- Create header with main heading -->
        <header>
            <h1>Manage Course Resources</h1>
            <nav>
                <a href="../auth/login.html">Login</a>
                <a href="list.html">View Resources</a>
            </nav>
        </header>

        <!-- Section 1: Add/Edit Resource Form -->
        <section>
            <!-- Add sub-heading -->
            <h2 id="form-heading">Add a New Resource</h2>
            
            <!-- Create form with id="resource-form" -->
            <form id="resource-form" action="#">
                <!-- Use fieldset to group controls -->
                <fieldset>
                    <!-- Add legend -->
                    <legend>Resource Details</legend>
                    
                    <!-- Label and input for title -->
                    <label for="resource-title">Title *</label>
                    <input type="text" id="resource-title" name="title" required>
                    
                    <!-- Label and textarea for description -->
                    <label for="resource-description">Description</label>
                    <textarea id="resource-description" name="description" rows="3"></textarea>
                    
                    <!-- Label and input for link -->
                    <label for="resource-link">Link (URL) *</label>
                    <input type="url" id="resource-link" name="link" required>
                    
                    <!-- Submit button -->
                    <button type="submit" id="add-resource" class="primary">Add Resource</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Resources List -->
        <section>
            <!-- Add sub-heading -->
            <h2>Existing Resources</h2>
            
            <!-- Create table with id="resources-table" -->
            <table id="resources-table" class="striped">
                <!-- Create thead -->
                <thead>
                    <tr>
                        <!-- Add th elements -->
                        <th>Title</th>
                        <th>Description</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                
                <!-- Create tbody with id="resources-tbody" -->
                <tbody id="resources-tbody">
                    <!-- Rows will be injected by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
</html>
