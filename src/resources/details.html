<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add meta tags for charset and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Add title -->
    <title>Resource Details</title>
    
    <!-- Link to CSS framework -->
    <link rel="stylesheet" href="../common/styles.css">
    
    <!-- Link script file -->
    <script src="details.js" defer></script>
</head>
<body>
    <main class="container">
        <!-- Header with main heading and id -->
        <header>
            <h1 id="resource-title">Loading...</h1>
            <nav>
                <a href="list.html">← Back to Resources</a>
                <a href="index.html">Home</a>
            </nav>
        </header>

        <!-- Section 1: Resource Information -->
        <article>
            <!-- Paragraph for description with id -->
            <p id="resource-description">Loading description...</p>
            
            <!-- Anchor tag for link with id -->
            <a id="resource-link" href="#" target="_blank" class="button">Access Resource Material</a>
        </article>

        <!-- Section 2: Discussion Forum -->
        <section id="discussion-forum">
            <!-- Sub-heading -->
            <h2>Discussion</h2>

            <!-- Div for comments with id -->
            <div id="comment-list">
                <p>Loading comments...</p>
            </div>

            <!-- Form for new comments with id -->
            <form id="comment-form" action="#">
                <!-- Fieldset -->
                <fieldset>
                    <!-- Legend -->
                    <legend>Leave a Comment</legend>
                    
                    <!-- Label and textarea for comment -->
                    <label for="new-comment">Your Comment</label>
                    <textarea id="new-comment" name="comment" rows="3" required placeholder="Share your thoughts about this resource..."></textarea>
                    
                    <!-- Submit button -->
                    <button type="submit" class="primary">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
</html>
